<!DOCTYPE html>
 <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="whidth=whdth, initial-scale=1.8">
        <title>Ejercicios con Node</title>
        <link rel="stylesheet" href="estilos.css">
    </head>
    <body>
        <header>
            <h1>Ejercicios con Node</h1>
        </header>
            <main>
                <section class="ejercicio" >
                    <h2> id ="titulo-arreglos">Arreglos del codigo <code>01-arreglos.js</code></h2>
                    <p>Datos de prueba de JS</p>
                    <div class="tabla-scroll">
                        <table id="tabla-talleres">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Instructor</th>
                                    <th>Cupo</th>
                                    <th>Inscritos</th>
                                </tr>
                            </thead>
                            <tbody>

                            </tbody>    
                        </table>
                    </div>

                    <form id="form-arreglos" class="formulario" >
                        <div class="campos">
                            <label for="operacion-arreglo" name="operacion-arreglo">Operacion</label>
                            <select name="operacion-arreglo" id="operacion-arreglo">
                                <option value="forEach">Lista Simple</option>
                                <option value="map">Map - Copia solo Nombres</option>
                                <option value="filter">filter - Filtrar talleres por cupo lleno</option>
                                <option value="find">find - Buscar taller por nombre del instructor</option>
                            </select>    
                        </div>
                        <button type="submit">Ejecutar</button>
                    </form>
                    <output class="resultado" id="resultado-arreglo" for="form-arreglo"></output>
                </section>
            </main>
            <script src="./js/app.js"></script>
    </body>
</html>
